<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard AI — Real-Time Phishing Detection</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#070b14',
              panel: '#0d1424',
              panel2: '#121b31',
              border: '#1e2b45',
              cyan: '#00e5ff',
              blue: '#3b82f6',
              green: '#22e39b',
              red: '#ff4d6d',
              amber: '#ffb020',
              muted: '#7d8bab',
            },
          },
          boxShadow: {
            glow: '0 0 24px rgba(0,229,255,0.25)',
            glowred: '0 0 28px rgba(255,77,109,0.35)',
            glowgreen: '0 0 28px rgba(34,227,155,0.35)',
          },
        },
      },
    };
  </script>

  <style>
    body { background:#070b14; }
    .grid-bg {
      background-image:
        linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glass { background: rgba(13,20,36,0.72); backdrop-filter: blur(10px); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background:#0d1424; }
    ::-webkit-scrollbar-thumb { background:#1e2b45; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background:#2a3c5e; }
    @keyframes pulseGlow { 0%,100%{opacity:.55} 50%{opacity:1} }
    .pulse { animation: pulseGlow 2s ease-in-out infinite; }
    @keyframes spin360 { to { transform: rotate(360deg); } }
    .scanning { animation: spin360 1s linear infinite; }
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  </style>
</head>
<body class="font-sans text-slate-200">
  <div id="root"></div>

  <script type="text/jsx-source" id="app-source">
    const { useState, useEffect, useRef, useCallback } = React;

    const API_BASE = (() => {
      const { protocol, hostname, origin } = window.location;
      if (protocol === 'file:' || !hostname) return 'http://localhost:8000';
      return origin;
    })();

    async function api(path, opts) {
      const res = await fetch(`${API_BASE}${path}`, opts);
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
        throw new Error(msg);
      }
      return res.json();
    }

    const Icon = ({ path, className = 'w-5 h-5' }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{path}</svg>
    );
    const ICONS = {
      shield: <><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></>,
      search: <><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></>,
      alert: <><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></>,
      check: <><path d="M20 6L9 17l-5-5"/></>,
      history: <><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/></>,
      chart: <><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 4-5"/></>,
      cpu: <><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></>,
      bolt: <><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></>,
    };

    const Card = ({ title, icon, right, children, className = '' }) => (
      <div className={`glass border border-cyber-border rounded-2xl p-5 ${className}`}>
        {(title || right) && (
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2 text-slate-100 font-semibold">
              {icon && <span className="text-cyber-cyan">{icon}</span>}
              <span>{title}</span>
            </div>
            {right}
          </div>
        )}
        {children}
      </div>
    );

    function RiskGauge({ value }) {
      const ref = useRef(null);
      const animated = useRef(0);
      useEffect(() => {
        const canvas = ref.current;
        const ctx = canvas.getContext('2d');
        const size = 220, cx = size/2, cy = size/2, r = 88;
        let raf, cur = animated.current;
        const target = Math.max(0, Math.min(100, value || 0));
        const color = target >= 65 ? '#ff4d6d' : target >= 35 ? '#ffb020' : '#22e39b';
        function draw(v) {
          ctx.clearRect(0,0,size,size);
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0.75*Math.PI, 2.25*Math.PI);
          ctx.lineWidth = 16; ctx.strokeStyle = '#152037'; ctx.lineCap='round'; ctx.stroke();
          const end = 0.75*Math.PI + (1.5*Math.PI)*(v/100);
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0.75*Math.PI, end);
          ctx.lineWidth = 16; ctx.strokeStyle = color; ctx.lineCap='round';
          ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.stroke(); ctx.shadowBlur = 0;
          ctx.fillStyle = color; ctx.font = '700 40px Inter, sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(`${Math.round(v)}%`, cx, cy-6);
          ctx.fillStyle = '#7d8bab'; ctx.font='600 13px Inter, sans-serif';
          ctx.fillText('RISK SCORE', cx, cy+26);
        }
        function step() {
          cur += (target - cur) * 0.12;
          if (Math.abs(target - cur) < 0.4) cur = target;
          draw(cur); animated.current = cur;
          if (cur !== target) raf = requestAnimationFrame(step);
        }
        step();
        return () => cancelAnimationFrame(raf);
      }, [value]);
      return <canvas ref={ref} width="220" height="220" className="mx-auto" />;
    }

    function ChartBox({ type, data, options, height = 240 }) {
      const ref = useRef(null);
      const chart = useRef(null);
      useEffect(() => {
        if (chart.current) chart.current.destroy();
        chart.current = new Chart(ref.current, { type, data, options });
        return () => chart.current && chart.current.destroy();
      }, [type, JSON.stringify(data), JSON.stringify(options)]);
      return <div style={{ height }}><canvas ref={ref}></canvas></div>;
    }

    const GRID = 'rgba(126,139,171,0.12)';
    const TICK = '#7d8bab';

    function Verdict({ result }) {
      if (!result) {
        return (
          <div className="text-center text-cyber-muted py-10">
            <div className="mx-auto w-14 h-14 rounded-full border border-cyber-border flex items-center justify-center mb-3">
              <Icon path={ICONS.search} className="w-7 h-7 text-cyber-muted" />
            </div>
            Submit a URL to run a real-time scan.
          </div>
        );
      }
      const phishing = result.is_phishing;
      const tone = phishing
        ? { c:'text-cyber-red', b:'border-cyber-red/40', bg:'bg-cyber-red/10', sh:'shadow-glowred', label:'PHISHING DETECTED', icon:ICONS.alert }
        : { c:'text-cyber-green', b:'border-cyber-green/40', bg:'bg-cyber-green/10', sh:'shadow-glowgreen', label:'LEGITIMATE', icon:ICONS.check };
      return (
        <div className={`fade-in rounded-xl border ${tone.b} ${tone.bg} ${tone.sh} p-4 flex items-center gap-4`}>
          <div className={`w-12 h-12 rounded-full flex items-center justify-center ${tone.bg} ${tone.c}`}>
            <Icon path={tone.icon} className="w-7 h-7" />
          </div>
          <div className="min-w-0">
            <div className={`text-lg font-bold ${tone.c}`}>{tone.label}</div>
            <div className="text-sm text-cyber-muted font-mono truncate">{result.url}</div>
          </div>
          <div className="ml-auto text-right">
            <div className={`text-2xl font-extrabold ${tone.c}`}>{result.risk_percent}%</div>
            <div className="text-xs text-cyber-muted">confidence {result.confidence}%</div>
          </div>
        </div>
      );
    }

    function App() {
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [explanation, setExplanation] = useState(null);
      const [error, setError] = useState('');
      const [history, setHistory] = useState([]);
      const [stats, setStats] = useState(null);
      const [modelInfo, setModelInfo] = useState(null);
      const [online, setOnline] = useState(null);

      const refresh = useCallback(async () => {
        try {
          const [h, s] = await Promise.all([
            api('/api/history?limit=50'),
            api('/api/stats'),
          ]);
          setHistory(h.items || []);
          setStats(s);
          setOnline(true);
        } catch (e) { setOnline(false); }
      }, []);

      useEffect(() => {
        api('/api/model-info').then(setModelInfo).catch(() => {});
        refresh();
        const t = setInterval(refresh, 8000);
        return () => clearInterval(t);
      }, [refresh]);

      const scan = async () => {
        const target = url.trim();
        if (!target) { setError('Please enter a URL.'); return; }
        setLoading(true); setError(''); setExplanation(null);
        try {
          const data = await api('/api/explain?top_k=8', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: target }),
          });
          setResult(data);
          setExplanation(data.explanation);
          setOnline(true);
          refresh();
        } catch (e) {
          setError(e.message || 'Scan failed. Is the backend running on :8000?');
          setOnline(false);
        } finally { setLoading(false); }
      };

      const onKey = (e) => { if (e.key === 'Enter') scan(); };

      const shapData = explanation && explanation.contributions.length ? {
        labels: explanation.contributions.map(c => c.feature),
        datasets: [{
          label: 'SHAP contribution',
          data: explanation.contributions.map(c => c.shap_value),
          backgroundColor: explanation.contributions.map(c =>
            c.shap_value >= 0 ? 'rgba(255,77,109,0.8)' : 'rgba(34,227,155,0.8)'),
          borderRadius: 5,
        }],
      } : null;

      const pieData = stats ? {
        labels: ['Legitimate', 'Phishing'],
        datasets: [{
          data: [stats.legitimate_count, stats.phishing_count],
          backgroundColor: ['#22e39b', '#ff4d6d'],
          borderColor: '#0d1424', borderWidth: 3,
        }],
      } : null;

      const lineData = stats && stats.daily && stats.daily.length ? {
        labels: stats.daily.map(d => d.day.slice(5)),
        datasets: [
          { label:'Phishing', data: stats.daily.map(d=>d.phishing),
            borderColor:'#ff4d6d', backgroundColor:'rgba(255,77,109,0.15)', tension:.35, fill:true, pointRadius:3 },
          { label:'Legitimate', data: stats.daily.map(d=>d.legitimate),
            borderColor:'#22e39b', backgroundColor:'rgba(34,227,155,0.12)', tension:.35, fill:true, pointRadius:3 },
        ],
      } : null;

      const globalShap = modelInfo && modelInfo.global_shap_importance
        ? modelInfo.global_shap_importance.feature_importance : null;
      const globalShapData = globalShap ? (() => {
        const entries = Object.entries(globalShap).slice(0, 10).reverse();
        return {
          labels: entries.map(e => e[0]),
          datasets: [{ label:'mean |SHAP|', data: entries.map(e=>e[1]),
            backgroundColor:'rgba(0,229,255,0.75)', borderRadius:5 }],
        };
      })() : null;

      const barOpts = (horizontal) => ({
        indexAxis: horizontal ? 'y' : 'x',
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ x:{ grid:{color:GRID}, ticks:{color:TICK} },
                 y:{ grid:{color:GRID}, ticks:{color:TICK} } },
      });

      return (
        <div className="min-h-screen grid-bg">
          <header className="sticky top-0 z-20 glass border-b border-cyber-border">
            <div className="max-w-7xl mx-auto px-5 py-3 flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-cyber-cyan/10 text-cyber-cyan flex items-center justify-center shadow-glow">
                <Icon path={ICONS.shield} className="w-6 h-6" />
              </div>
              <div>
                <h1 className="text-lg font-extrabold tracking-tight text-white">
                  PhishGuard <span className="text-cyber-cyan">AI</span>
                </h1>
                <p className="text-[11px] text-cyber-muted -mt-0.5">Real-Time Phishing Detection · MSc Cybersecurity</p>
              </div>
              <div className="ml-auto flex items-center gap-4 text-sm">
                <span className="hidden sm:flex items-center gap-2 text-cyber-muted">
                  <Icon path={ICONS.cpu} className="w-4 h-4 text-cyber-cyan" />
                  {modelInfo ? `${modelInfo.model} · ${modelInfo.num_features} feats` : '—'}
                </span>
                <span className="flex items-center gap-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${online ? 'bg-cyber-green pulse' : 'bg-cyber-red'}`}></span>
                  <span className="text-cyber-muted">{online ? 'API Online' : 'API Offline'}</span>
                </span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-5 py-6 space-y-6">
            <Card>
              <div className="flex items-center gap-2 mb-3 text-cyber-cyan font-semibold">
                <Icon path={ICONS.search} /> URL Submission Portal
              </div>
              <div className="flex flex-col sm:flex-row gap-3">
                <div className="flex-1 flex items-center gap-2 bg-cyber-bg border border-cyber-border rounded-xl px-4">
                  <span className="text-cyber-muted font-mono text-sm">https://</span>
                  <input
                    value={url}
                    onChange={e => setUrl(e.target.value)}
                    onKeyDown={onKey}
                    placeholder="paste a URL to analyse, e.g. secure-login-paypal.tk/verify"
                    className="flex-1 bg-transparent py-3 outline-none text-slate-100 placeholder:text-cyber-muted/60 font-mono text-sm"
                  />
                </div>
                <button
                  onClick={scan} disabled={loading}
                  className="px-6 py-3 rounded-xl font-semibold bg-cyber-cyan text-cyber-bg hover:bg-white transition shadow-glow disabled:opacity-60 flex items-center justify-center gap-2">
                  {loading
                    ? <><Icon path={ICONS.bolt} className="w-5 h-5 scanning" /> Scanning…</>
                    : <><Icon path={ICONS.bolt} className="w-5 h-5" /> Scan URL</>}
                </button>
              </div>
              {error && <div className="mt-3 text-sm text-cyber-red flex items-center gap-2"><Icon path={ICONS.alert} className="w-4 h-4"/>{error}</div>}
              <div className="mt-3 flex flex-wrap gap-2">
                {['https://www.google.com','https://docs.google.com/presentation/d/abc/pub','http://secure-login-paypal-verify.tk/account/confirm?id=1','https://verifypichincha.webcindario.com'].map(s => (
                  <button key={s} onClick={()=>setUrl(s)}
                    className="text-xs font-mono px-2.5 py-1 rounded-lg border border-cyber-border text-cyber-muted hover:text-cyber-cyan hover:border-cyber-cyan/50 transition truncate max-w-[240px]">
                    {s}
                  </button>
                ))}
              </div>
            </Card>

            <div className="grid lg:grid-cols-3 gap-6">
              <Card title="Real-Time Detection Result" icon={<Icon path={ICONS.shield}/>} className="lg:col-span-2">
                <Verdict result={result} />
                {result && (
                  <div className="grid sm:grid-cols-3 gap-3 mt-4">
                    {[['URL Length','url_length'],['HTTPS','is_https'],['Subdomains','num_subdomains'],
                      ['Suspicious Words','num_suspicious_words'],['Has IP','has_ip_address'],['Suspicious TLD','has_suspicious_tld']]
                      .map(([label,key]) => (
                      <div key={key} className="bg-cyber-bg/60 border border-cyber-border rounded-lg px-3 py-2">
                        <div className="text-[11px] text-cyber-muted">{label}</div>
                        <div className="font-mono text-slate-100">
                          {result.features_extracted?.[key] ?? '—'}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Card>

              <Card title="Risk Score Gauge" icon={<Icon path={ICONS.chart}/>}>
                <RiskGauge value={result ? result.risk_percent : 0} />
                <p className="text-center text-xs text-cyber-muted mt-2">
                  {result ? `Model: ${result.model_used}` : 'Awaiting scan'}
                </p>
              </Card>
            </div>

            <Card title="Feature Importance — Why? (SHAP)" icon={<Icon path={ICONS.bolt}/>}
              right={<span className="text-xs text-cyber-muted">red = pushes toward phishing · green = toward legitimate</span>}>
              {shapData
                ? <ChartBox type="bar" data={shapData} options={barOpts(true)} height={300} />
                : <div className="text-center text-cyber-muted py-12">Scan a URL to see its per-feature SHAP explanation.</div>}
            </Card>

            <div className="grid lg:grid-cols-3 gap-6">
              <Card title="Detection Breakdown" icon={<Icon path={ICONS.chart}/>}>
                {pieData && (stats.total_scans > 0)
                  ? <ChartBox type="doughnut" data={pieData} height={240}
                      options={{responsive:true,maintainAspectRatio:false,cutout:'62%',
                        plugins:{legend:{labels:{color:'#cbd5e1'},position:'bottom'}}}} />
                  : <div className="text-center text-cyber-muted py-16">No scans yet.</div>}
              </Card>
              <Card title="Detection Trend" icon={<Icon path={ICONS.chart}/>} className="lg:col-span-2">
                {lineData
                  ? <ChartBox type="line" data={lineData} height={240}
                      options={{responsive:true,maintainAspectRatio:false,
                        plugins:{legend:{labels:{color:'#cbd5e1'}}},
                        scales:{x:{grid:{color:GRID},ticks:{color:TICK}},y:{grid:{color:GRID},ticks:{color:TICK},beginAtZero:true}}}} />
                  : <div className="text-center text-cyber-muted py-16">No trend data yet.</div>}
              </Card>
            </div>

            {stats && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[['Total Scans', stats.total_scans, 'text-cyber-cyan'],
                  ['Phishing', stats.phishing_count, 'text-cyber-red'],
                  ['Legitimate', stats.legitimate_count, 'text-cyber-green'],
                  ['Avg Risk', `${((stats.avg_risk_score || 0)*100).toFixed(1)}%`, 'text-cyber-amber']]
                  .map(([l,v,c]) => (
                  <div key={l} className="glass border border-cyber-border rounded-xl p-4">
                    <div className="text-xs text-cyber-muted">{l}</div>
                    <div className={`text-2xl font-extrabold ${c}`}>{v}</div>
                  </div>
                ))}
              </div>
            )}

            <div className="grid lg:grid-cols-2 gap-6">
              <Card title="Global Feature Importance (SHAP)" icon={<Icon path={ICONS.cpu}/>}>
                {globalShapData
                  ? <ChartBox type="bar" data={globalShapData} options={barOpts(true)} height={300}/>
                  : <div className="text-center text-cyber-muted py-16">Model SHAP importance unavailable.</div>}
              </Card>

              <Card title="Prediction History" icon={<Icon path={ICONS.history}/>}
                right={<span className="text-xs text-cyber-muted">{history.length} records</span>}>
                <div className="overflow-auto max-h-[320px]">
                  <table className="w-full text-sm">
                    <thead className="text-cyber-muted text-left sticky top-0 glass">
                      <tr className="border-b border-cyber-border">
                        <th className="py-2 pr-2 font-medium">Time</th>
                        <th className="py-2 pr-2 font-medium">URL</th>
                        <th className="py-2 pr-2 font-medium">Verdict</th>
                        <th className="py-2 font-medium text-right">Risk</th>
                      </tr>
                    </thead>
                    <tbody>
                      {history.length === 0 && (
                        <tr><td colSpan="4" className="py-8 text-center text-cyber-muted">No history yet.</td></tr>
                      )}
                      {history.map(h => (
                        <tr key={h.id} className="border-b border-cyber-border/50 hover:bg-cyber-panel2/50">
                          <td className="py-2 pr-2 text-cyber-muted font-mono text-xs whitespace-nowrap">
                            {new Date(h.timestamp).toLocaleTimeString()}
                          </td>
                          <td className="py-2 pr-2 font-mono text-xs max-w-[220px] truncate" title={h.url}>{h.url}</td>
                          <td className="py-2 pr-2">
                            <span className={`px-2 py-0.5 rounded-md text-xs font-semibold ${h.is_phishing ? 'bg-cyber-red/15 text-cyber-red' : 'bg-cyber-green/15 text-cyber-green'}`}>
                              {h.is_phishing ? 'PHISHING' : 'LEGIT'}
                            </span>
                          </td>
                          <td className="py-2 text-right font-mono">
                            {(h.probability_score*100).toFixed(1)}%
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </div>

            <footer className="text-center text-xs text-cyber-muted py-6">
              PhishGuard AI · FastAPI + scikit-learn + SHAP · MSc Cybersecurity Dissertation ·
              API base <span className="font-mono text-cyber-cyan">{API_BASE}</span>
            </footer>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    (function () {
      try {
        var src = document.getElementById('app-source').textContent;
        var out = Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
        }).code;
        var s = document.createElement('script');
        s.textContent = out;
        document.body.appendChild(s);
      } catch (err) {
        document.getElementById('root').innerHTML =
          '<pre style="color:#ff4d6d;padding:24px;white-space:pre-wrap;font-family:monospace">'
          + 'Failed to start dashboard:\n' + (err && err.message ? err.message : err) + '</pre>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
