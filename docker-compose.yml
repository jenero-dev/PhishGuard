# ---------------------------------------------------------------------------
# Phishing Website Detection System - Docker Compose
# ---------------------------------------------------------------------------
# Quick start:
#   docker compose up --build
# Then open http://localhost:8000/app in your browser.
#
# NOTE ON ARCHITECTURE:
#   The reference architecture diagram shows PostgreSQL (persistence) and
#   Redis (caching) as separate services. For a self-contained, reproducible
#   local / dissertation deployment this compose file uses the application's
#   built-in SQLite store (data/predictions.db) and in-process model caching,
#   which require zero external services. Optional postgres + redis service
#   stubs are included below (commented out) to show how the system would be
#   scaled out in a production environment.
# ---------------------------------------------------------------------------

services:
  api:
    build: .
    image: phishing-detector:latest
    container_name: phishing-detector
    ports:
      - "8000:8000"        # host:container  ->  http://localhost:8000/app
    volumes:
      - ./data:/app/data   # persist SQLite prediction history across restarts
      - ./logs:/app/logs   # persist API logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -------------------------------------------------------------------------
  # OPTIONAL production-scale services (disabled by default).
  # Uncomment and wire up DATABASE_URL / REDIS_URL in app.py to enable.
